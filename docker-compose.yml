# Production compose — require real secrets via environment / .env
# Mongo is internal-only (not published). Override JWT_* or the API will refuse to start.
services:
  mongodb:
    image: mongo:7
    container_name: pulse-mongodb
    restart: unless-stopped
    # Intentionally no host ports — only reachable on the internal network
    volumes:
      - pulse_mongo_data:/data/db
    networks:
      - pulse-network
    command: ['mongod', '--bind_ip_all']

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulse-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/pulse
      # No insecure defaults — set these in the host environment or a secrets file
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      API_URL: ${API_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_DIR: /app/uploads
    volumes:
      - pulse_uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - pulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty = same-origin /api via nginx proxy (correct for this compose layout)
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    container_name: pulse-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - pulse-network

volumes:
  pulse_mongo_data:
  pulse_uploads:

networks:
  pulse-network:
    driver: bridge
