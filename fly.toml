# Fly.io — API-only example for the existing Node/Express backend.
# Prerequisites: MongoDB Atlas (or other always-on Mongo), flyctl logged in.
#
#   cd backend && fly launch --config ../fly.toml
#   fly secrets set JWT_ACCESS_SECRET=... JWT_REFRESH_SECRET=... MONGODB_URI=... \
#     CLIENT_URL=... API_URL=... CORS_ORIGINS=... COOKIE_SECURE=true
#   fly deploy --config ../fly.toml --dockerfile backend/Dockerfile
#
# Scale: keep count=1 until Redis-backed presence/calls exist (see docs/OPS.md).
# This is NOT a Cloudflare Workers deployment.

app = "pulse-api"  # change after `fly launch`
primary_region = "syd"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # UPLOAD_DIR is container-local; attach a volume for persistence if needed

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
